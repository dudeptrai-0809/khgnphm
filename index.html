<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bio Link Profile - Phạm Thái Khang</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #050507 0%, #121216 50%, #1c1c24 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-hover: rgba(255, 255, 255, 0.1);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-sub: #a1a1aa;
      --accent: #f4f4f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* === HIỆU ỨNG CHỚP MẮT NHIỀU NHỊP RỒI MỞ HẲN === */
    .eye-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      background: rgba(5, 5, 7, 0.7);
      animation: multiBlinkBlur 2.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .eyelid-top, .eyelid-bottom {
      position: fixed;
      left: 0;
      width: 100%;
      height: 55vh;
      background: #000000;
      z-index: 10000;
      pointer-events: none;
    }

    .eyelid-top {
      top: 0;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.95);
      animation: multiBlinkTop 2.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .eyelid-bottom {
      bottom: 0;
      box-shadow: 0 -25px 50px rgba(0, 0, 0, 0.95);
      animation: multiBlinkBottom 2.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Chuỗi chớp mắt liên tục 3 nhịp trước khi mở hoàn toàn */
    @keyframes multiBlinkTop {
      0%   { transform: translateY(0); }       /* Nhắm chặt */
      15%  { transform: translateY(-35%); }    /* Hé lần 1 */
      25%  `{ transform: translateY(-5%); }`     /* Nhắm lại nhanh */
      38%  { transform: translateY(-55%); }    /* Hé lần 2 rộng hơn */
      50%  { transform: translateY(-15%); }    /* Chớp nhẹ lại */
      65%  { transform: translateY(-70%); }    /* Hé lần 3 */
      100% { transform: translateY(-120%); }   /* Mở hẳn ra ngoài */
    }

    @keyframes multiBlinkBottom {
      0%   { transform: translateY(0); }
      15%  { transform: translateY(35%); }
      25%  { transform: translateY(5%); }
      38%  { transform: translateY(55%); }
      50%  { transform: translateY(15%); }
      65%  { transform: translateY(70%); }
      100% { transform: translateY(120%); }
    }

    @keyframes multiBlinkBlur {
      0%   { backdrop-filter: blur(32px); background: rgba(5, 5, 7, 0.9); }
      25%  { backdrop-filter: blur(18px); background: rgba(5, 5, 7, 0.5); }
      50%  { backdrop-filter: blur(22px); background: rgba(5, 5, 7, 0.6); } /* Nhịp chớp */
      70%  { backdrop-filter: blur(10px); background: rgba(5, 5, 7, 0.2); }
      100% { backdrop-filter: blur(0px);  background: rgba(5, 5, 7, 0); visibility: hidden; }
    }

    @keyframes focusCard {
      0%   { opacity: 0; filter: blur(16px); transform: scale(0.95); }
      50%  { opacity: 0.4; filter: blur(8px); transform: scale(0.97); }
      100% { opacity: 1; filter: blur(0px); transform: scale(1); }
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 16px;
      overflow-x: hidden;
    }

    .profile-card {
      width: 100%;
      max-width: 480px;
      background: rgba(18, 18, 22, 0.65);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      overflow: hidden;
      backdrop-filter: blur(16px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      text-align: center;
      padding-bottom: 32px;
      animation: focusCard 2.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .banner {
      position: relative;
      width: 100%;
      height: 165px;
      background-image: url('https://cdn.discordapp.com/attachments/1509074844443082873/1571404596989923328/IMG_3068.jpg?ex=6afa9c13&is=6af94a93&hm=2410ab7d8087bacb466c4d8a4bb0bf6d071f49117e796c5237874b47189690de');
      background-size: cover;
      background-position: center;
    }

    .banner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(12,12,16,0.85));
    }

    .share-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 99px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .share-btn:hover {
      background: var(--accent);
      color: #09090b;
      border-color: var(--accent);
    }

    .avatar-wrap {
      position: relative;
      width: 112px;
      height: 112px;
      margin: -56px auto 14px;
      z-index: 2;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #121216;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .status-dot {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 18px;
      height: 18px;
      background: #22c55e;
      border: 3px solid #121216;
      border-radius: 50%;
    }

    .content {
      padding: 0 24px;
    }

    .name {
      font-size: 23px;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .verified {
      color: var(--accent);
      font-size: 18px;
    }

    .bio {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .social-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .social-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 17px;
      transition: 0.25s;
    }

    .social-icon:hover {
      background: var(--accent);
      color: #09090b;
      transform: translateY(-3px);
    }

    .spotify-wrap {
      margin-bottom: 16px;
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-sub);
      opacity: 0.6;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #22c55e;
      color: #fff;
      padding: 10px 20px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 600;
      transition: 0.3s;
      opacity: 0;
      z-index: 99;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Lớp phủ hiệu ứng chớp mắt nhiều nhịp -->
  <div class="eyelid-top"></div>
  <div class="eyelid-bottom"></div>
  <div class="eye-overlay"></div>

  <div class="profile-card">
    <div class="banner">
      <button class="share-btn" onclick="copyProfileLink()">
        <i class="fa-solid fa-link"></i> Sao chép link
      </button>
    </div>

    <div class="avatar-wrap">
      <img src="https://cdn.discordapp.com/attachments/1509074844443082873/1571404592091107502/IMG_2976.jpg?ex=6afa9c12&is=6af94a92&hm=f9be816a731d3a5dcb686ad4ac10174249351ccb99190691065879feec089a0f" alt="Avatar" class="avatar">
      <span class="status-dot" title="Đang hoạt động"></span>
    </div>

    <div class="content">
      <h1 class="name">
        Phạm Thái Khang <i class="fa-solid fa-circle-check verified"></i>
      </h1>
      <p class="bio">
        8th December 2009 live in Vietnam<br>
        Free Code profile in my github
      </p>

      <div class="social-row">
        <a href="https://www.facebook.com/share/1BLVBG1YMn/?mibextid=wwXIFr" target="_blank" class="social-icon" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="https://www.tiktok.com/@khgn.8129?_r=1&_t=ZS-9BPzEWzeMk9" target="_blank" class="social-icon" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
        <a href="https://www.instagram.com/khg_phm?rpxt=MWI3MWtnenNrd2lkYg%3D%3D&utm_source=qr" target="_blank" class="social-icon" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://github.com/dudeptrai-0809" target="_blank" class="social-icon" title="GitHub"><i class="fa-brands fa-github"></i></a>
        <a href="mailto:khgnphm0812@gmail.com" class="social-icon" title="Email"><i class="fa-solid fa-envelope"></i></a>
      </div>

     <div class="spotify-wrap">
        <iframe style="border-radius: 16px;" src="https://open.spotify.com/embed/track/0lTrNLrN8c9swHGt4dAfoD?utm_source=generator&theme=0" width="100%" height="80" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      </div>

      <div class="footer">© 2026 Made by Khang Phạm</div>
    </div>
  </div>

  <div class="toast" id="toast">Đã sao chép đường dẫn Profile!</div>

  <script>
    function copyProfileLink() {
      navigator.clipboard.writeText(window.location.href);
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
