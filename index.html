<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bio Link Profile - Phạm Thái Khang</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      
      --bg-gradient: linear-gradient(135deg, #050507 0%, #121216 50%, #1c1c24 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-hover: rgba(255, 255, 255, 0.1);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-sub: #a1a1aa;
      --accent: #f4f4f5; /* Điểm nhấn trắng sáng sang trọng */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 16px;
    }

    .profile-card {
      width: 100%;
      max-width: 480px;
      background: rgba(18, 18, 22, 0.65);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      overflow: hidden;
      backdrop-filter: blur(16px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      text-align: center;
      padding-bottom: 32px;
    }

    .banner {
      position: relative;
      width: 100%;
      height: 165px;
      background-image: url('https://cdn.discordapp.com/attachments/1509074844443082873/1571404596989923328/IMG_3068.jpg?ex=6afa9c13&is=6af94a93&hm=2410ab7d8087bacb466c4d8a4bb0bf6d071f49117e796c5237874b47189690de');
      background-size: cover;
      background-position: center;
    }

    .banner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(12,12,16,0.85));
    }

    .share-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 99px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .share-btn:hover {
      background: var(--accent);
      color: #09090b;
      border-color: var(--accent);
    }

    .avatar-wrap {
      position: relative;
      width: 112px;
      height: 112px;
      margin: -56px auto 14px;
      z-index: 2;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #121216;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .status-dot {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 18px;
      height: 18px;
      background: #22c55e;
      border: 3px solid #121216;
      border-radius: 50%;
    }

    .content {
      padding: 0 24px;
    }

    .name {
      font-size: 23px;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .verified {
      color: var(--accent);
      font-size: 18px;
    }

    .bio {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .social-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .social-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 17px;
      transition: 0.25s;
    }

    .social-icon:hover {
      background: var(--accent);
      color: #09090b;
      transform: translateY(-3px);
    }

    .spotify-wrap {
      margin-bottom: 16px;
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-sub);
      opacity: 0.6;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #22c55e;
      color: #fff;
      padding: 10px 20px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 600;
      transition: 0.3s;
      opacity: 0;
      z-index: 99;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
